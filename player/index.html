<!doctype html>
<meta charset="utf-8">
<!-- Player da playlist, como componente do Streamlit: a lista chega por mensagem (streamlit:render),
     então adicionar ou remover faixas NÃO recarrega esta página e o som continua tocando. -->
<style>
  body {margin:0; font-family:'Source Sans Pro',sans-serif; color:#2e1f4a;}
  .p {display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  button {border:none; border-radius:999px; padding:10px 20px; font-size:15px; font-weight:600;
          cursor:pointer; color:#fff; background:linear-gradient(90deg,#7b4fd6,#a35bd9);}
  button.sec {background:#f1e9fc; color:#7b4fd6;}
  button.ic {padding:10px 14px; min-width:44px;}
  button:disabled {opacity:.45; cursor:default;}
  button:focus-visible, select:focus-visible, input:focus-visible {outline:2px solid #7b4fd6; outline-offset:2px;}
  label {font-size:14px; display:flex; align-items:center; gap:6px;}
  .agora {margin:12px 0 6px; font-size:15px; min-height:20px;}
  .linha {display:flex; align-items:center; gap:10px;}
  .barra {flex:1; height:6px; border-radius:6px; background:#ece2fa; overflow:hidden;}
  .barra div {height:100%; width:0; background:linear-gradient(90deg,#7b4fd6,#d19a2a);}
  .tempo {font-size:13px; color:#6b5a8a; font-variant-numeric:tabular-nums; min-width:92px; text-align:right;}
  #vol {width:90px; accent-color:#7b4fd6;}
  #lista {list-style:none; margin:12px 0 0; padding:0; max-height:150px; overflow-y:auto;
          border:1px solid #e4d6f7; border-radius:12px; background:rgba(255,255,255,.7);}
  #lista li {padding:8px 12px; font-size:14px; cursor:pointer; border-bottom:1px solid #f1e9fc;}
  #lista li:last-child {border-bottom:none;}
  #lista li:hover {background:#f6effd;}
  #lista li.on {background:#ece2fa; font-weight:600; color:#5a31b4;}
  #tela {width:100%; aspect-ratio:16/9; display:block; border-radius:14px; background:#0b0620; margin-bottom:12px;}
  #tela:fullscreen {border-radius:0;}
  select {border:1px solid #e4d6f7; border-radius:999px; padding:8px 12px; background:#fff; color:#2e1f4a; font-size:14px;}
</style>
<canvas id="tela" width="1280" height="720"></canvas>
<div class="p">
  <button id="ant" class="sec ic" title="Faixa anterior (se passou de 3 s, volta ao começo da atual)" aria-label="Faixa anterior">⏮</button>
  <button id="play">▶ Tocar playlist</button>
  <button id="prox" class="sec ic" title="Próxima faixa" aria-label="Próxima faixa">⏭</button>
  <button id="stop" class="sec">■ Parar</button>
  <label title="Volume">🔊 <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume"></label>
  <button id="cheia" class="sec">⛶ Tela cheia</button>
  <select id="visual" aria-label="Símbolo">
    <option value="alternar">🔄 Alternar símbolos</option>
    <option value="flor">🌸 Flor da Vida</option>
    <option value="metatron">✡ Metatron</option>
    <option value="merkaba">✴ Merkabá</option>
    <option value="lotus">🪷 Lótus</option>
  </select>
  <label><input type="checkbox" id="loop" checked> Repetir</label>
</div>
<div class="agora" id="agora"></div>
<div class="linha"><div class="barra"><div id="prog"></div></div><span class="tempo" id="tempo"></span></div>
<ol id="lista" aria-label="Faixas da playlist"></ol>
<script>
const VOL = 0.5, FADE = 1.5;
let LISTA = [], ACORDES = [], SINOS = [], GRAVACOES = {}, BUF = {};  // preenchidos pelo Streamlit
let ctx, saida, analisador, mestre, atual = null, idx = 0, inicio = 0, pausado = false;
const $ = id => document.getElementById(id);

// Entrada e saída de cada faixa em potência constante (seno/cosseno em passos lineares): quando a
// próxima começa durante a saída da anterior, o volume somado fica parelho, sem buraco no meio.
const PASSOS = 16;
function rampaEntra(p, t, dur) {
  p.setValueAtTime(0, t);
  for (let k = 1; k <= PASSOS; k++) p.linearRampToValueAtTime(VOL * Math.sin(Math.PI / 2 * k / PASSOS), t + dur * k / PASSOS);
}
function rampaSai(p, t, dur) {
  p.setValueAtTime(VOL, t);
  for (let k = 1; k <= PASSOS; k++) p.linearRampToValueAtTime(VOL * Math.cos(Math.PI / 2 * k / PASSOS), t + dur * k / PASSOS);
}

let saindo = [];  // faixas que ainda estão no fade de saída enquanto a próxima já entrou

// `cruzando`: a faixa anterior não é cortada, só termina o fade de saída por baixo da nova.
function tocar(i, cruzando = false) {
  if (!cruzando) parar();
  if (i >= LISTA.length) {
    if (!$("loop").checked) return;  // sem repetir: a última faixa termina sozinha (ver `acabou`)
    i = 0;
  }
  if (i < 0) i = 0;
  if (!LISTA.length) return;
  if (cruzando && atual) saindo.push(atual);
  idx = i; const it = LISTA[i], t = ctx.currentTime, fim = t + it.seg, xf = Math.min(FADE, it.seg / 4);
  const g = ctx.createGain();
  rampaEntra(g.gain, t, xf);
  rampaSai(g.gain, fim - xf, xf);
  const corte = ctx.createGain();  // só para calar a faixa com suavidade ao trocar/parar à mão
  g.connect(corte).connect(saida);
  // gravação que ainda não terminou de baixar (faixa adicionada com a playlist tocando) fica de fora
  const amb = (it.amb || []).filter(n => !GRAVACOES[n] || BUF[n]), vol = it.vol ?? 1;
  const escala = 1 / Math.max(1, 0.8 * vol + (amb.length ? 0.8 : 0));
  const gTom = ganho(0.8 * vol * escala), gAmb = ganho(0.8 * escala);
  gTom.connect(g); gAmb.connect(ctx.createDynamicsCompressor()).connect(g);  // limitador do ambiente
  const extras = [];
  const oscs = it.freqs.map((f, c) => {
    const o = ctx.createOscillator(); o.frequency.value = f;
    if (it.freqs.length === 2) {  // binaural: um tom em cada ouvido
      const p = ctx.createStereoPanner(); p.pan.value = c ? 1 : -1; o.connect(p); p.connect(gTom);
    } else if (it.pulso) {  // isocrônico: o ganho oscila entre 0 e 1 na frequência do pulso
      const gate = ctx.createGain(); gate.gain.value = 0.5; o.connect(gate).connect(gTom);
      const lfo = ctx.createOscillator(); lfo.frequency.value = it.pulso;
      lfo.connect(ganho(0.5)).connect(gate.gain); lfo.start(t); lfo.stop(fim); extras.push(lfo);
    } else o.connect(gTom);
    o.start(t); o.stop(fim); return o;
  });
  oscs.push(...extras);
  amb.forEach(nome => oscs.push(...(CAMADAS[nome](it, gAmb, t, fim, oscs) || [])));
  // Gatilho no relógio de áudio (onended não é freado em aba em segundo plano, como os timers):
  // dispara a próxima faixa quando começa o fade de saída desta.
  const gat = ctx.createOscillator();
  gat.connect(ganho(0)).connect(saida); gat.start(t); gat.stop(fim - xf);
  gat.onended = () => tocar(idx + 1, true);
  oscs.push(gat);
  const faixa = {g, corte, oscs, it};
  oscs[0].onended = () => acabou(faixa);
  atual = faixa; inicio = t;
  $("agora").textContent = `♪ ${i + 1}/${LISTA.length} — ${it.titulo}`;
  marcar();
  VIS.faixa(i, it.legenda || it.titulo.split(" · ")[0], it.tema || "");
}

// A faixa chegou ao fim sozinha. Se foi a última e não há repetição, limpa o painel; se já
// passou o bastão (cruzamento), só sai da lista das que estavam saindo.
function acabou(f) {
  saindo = saindo.filter(s => s !== f);
  if (atual === f) { atual = null; $("agora").textContent = ""; $("prog").style.width = 0; $("tempo").textContent = ""; marcar(); VIS.faixa(-1, ""); atualizarPlay(); }
}

// ---------- Lista de faixas, tempo e botões ----------
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function desenharLista() {
  const ol = $("lista");
  ol.replaceChildren(...LISTA.map((it, i) => {
    const li = document.createElement("li");
    li.textContent = `${i + 1}. ${it.titulo}`; li.title = "Tocar esta faixa";
    li.onclick = () => iniciar(i);
    return li;
  }));
  ol.style.display = LISTA.length ? "" : "none";
  marcar();
}
function marcar() {
  [...$("lista").children].forEach((li, i) => li.classList.toggle("on", !!atual && i === idx));
  $("ant").disabled = $("prox").disabled = !LISTA.length;
}
function atualizarPlay() {
  $("play").textContent = !atual ? "▶ Tocar playlist" : pausado ? "▶ Continuar" : "⏸ Pausar";
}

// Camadas de ambiente (mesma receita do download, em Web Audio). Cada uma devolve
// as fontes que agendou, para poderem ser paradas.
const ganho = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
const filtro = (tipo, f, q = 0.7) => {
  const b = ctx.createBiquadFilter(); b.type = tipo; b.frequency.value = f; b.Q.value = q; return b;
};
function ruido(t, fim) {
  const b = ctx.createBuffer(2, ctx.sampleRate * 8, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; s.start(t); s.stop(fim); return s;
}
function lfo(freq, prof, param, t, fim) {
  const o = ctx.createOscillator(), g = ganho(prof); o.frequency.value = freq; o.connect(g); g.connect(param);
  o.start(t); o.stop(fim); return o;
}
const CAMADAS = {
  chuva(it, dest, t, fim) {
    const s = ruido(t, fim); s.connect(filtro("highpass", 900)).connect(filtro("lowpass", 8000)).connect(ganho(0.35)).connect(dest);
    return [s];
  },
  ondas(it, dest, t, fim) {
    const s = ruido(t, fim), g = ganho(0.5);
    s.connect(filtro("lowpass", 450)).connect(g).connect(dest);
    return [s, lfo(1 / 8, 0.48, g.gain, t, fim)];
  },
  vento(it, dest, t, fim) {
    const s = ruido(t, fim), bp = filtro("bandpass", 500, 1.5), g = ganho(0.6);
    s.connect(bp).connect(g).connect(dest);
    return [s, lfo(1 / 16, 300, bp.frequency, t, fim), lfo(1 / 32, 0.35, g.gain, t, fim)];
  },
  // Agendada trecho a trecho (um acorde + 4 sinos = 16 s): o relógio de áudio dispara o trecho
  // seguinte no meio do atual. Faixas de horas não criam milhares de osciladores de uma vez.
  // As fontes entram em `lista` (as mesmas de `oscs`) para parar() alcançar todas.
  melodia(it, dest, t, fim, lista) {
    const trecho = k => {
      const ti = t + 16 * k;
      if (ti >= fim) return;
      for (const r of ACORDES[k % 4]) [-0.6, 0.6].forEach((pan, c) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner();
        o.frequency.value = it.raiz * r * (c ? 1.003 : 1); p.pan.value = pan;
        g.gain.setValueAtTime(0, ti); g.gain.linearRampToValueAtTime(0.06, ti + 8); g.gain.linearRampToValueAtTime(0, ti + 16);
        o.connect(g).connect(p).connect(dest); o.start(ti); o.stop(Math.min(ti + 16, fim)); lista.push(o);
      });
      for (let j = 0; j < 4 && ti + j * 4 < fim; j++) {
        const tb = ti + j * 4, o = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner();
        o.frequency.value = it.raiz * SINOS[Math.floor(Math.random() * SINOS.length)]; p.pan.value = Math.random() * 1.2 - 0.6;
        g.gain.setValueAtTime(0, tb); g.gain.linearRampToValueAtTime(0.12, tb + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, tb + 3.9);
        o.connect(g).connect(p).connect(dest); o.start(tb); o.stop(Math.min(tb + 4, fim)); lista.push(o);
      }
      const rel = ctx.createOscillator();  // relógio: termina no meio do trecho e agenda o próximo
      rel.connect(ganho(0)).connect(dest); rel.start(ti); rel.stop(ti + 8);
      rel.onended = () => trecho(k + 1);
      lista.push(rel);
    };
    trecho(0);
  },
};

// Gravações reais: baixadas uma vez de app/static e tocadas em loop; o canal direito
// começa no meio do loop (mesmo truque de estéreo do download).
// Este componente é servido de /component/..., então o endereço dos sons parte da página do app
// (a mesma origem, por isso dá para ler o endereço do pai; streamlitUrl é o plano B).
function urlDoApp() {
  try { return window.parent.document.baseURI; }
  catch (e) { return new URLSearchParams(location.search).get("streamlitUrl") || location.href; }
}
const baixando = {};
// FLAC é sem perda (decodifica idêntico ao WAV, então o loop segue sem emenda) e ~45% menor:
// pesa menos no celular. Se o .flac não existir ou não decodificar, cai para o .wav.
async function baixarSom(arquivo) {
  let erro;
  for (const ext of ["flac", "wav"]) {
    try {
      const r = await fetch(new URL(`app/static/${arquivo}.${ext}`, urlDoApp()));
      if (r.ok) return await ctx.decodeAudioData(await r.arrayBuffer());
      erro = new Error(`${arquivo}.${ext}: HTTP ${r.status}`);
    } catch (e) { erro = e; }
  }
  throw erro;
}
async function carregar(nomes) {
  await Promise.all(nomes.filter(n => GRAVACOES[n] && !BUF[n]).map(n => baixando[n] ||= (async () => {
    BUF[n] = await baixarSom(GRAVACOES[n]);
  })().catch(e => { delete baixando[n]; throw e; })));  // falhou: deixa tentar de novo depois
}
function registrarGravacoes() {
  for (const n in GRAVACOES) CAMADAS[n] = (it, dest, t, fim) => [-1, 1].map((pan, c) => {
    const s = ctx.createBufferSource(), p = ctx.createStereoPanner();
    s.buffer = BUF[n]; s.loop = true; p.pan.value = pan;
    s.connect(p).connect(ganho(1.5)).connect(dest);
    s.start(t, c * BUF[n].duration / 2); s.stop(fim); return s;
  });
}

// Cala a faixa atual e as que ainda estavam saindo, com um fade curto (sem estalo). O onended de
// cada fonte é desligado antes, para parar à mão não disparar "próxima faixa".
function parar() {
  const agora = ctx ? ctx.currentTime : 0;
  for (const f of [atual, ...saindo]) {
    if (!f) continue;
    f.oscs.forEach(o => { o.onended = null; try { o.stop(agora + 0.3); } catch (e) {} });
    f.corte.gain.setTargetAtTime(0, agora, 0.06);
    setTimeout(() => f.g.disconnect(), 800);
  }
  atual = null; saindo = [];
}

// Volume geral (curva quadrática: o ouvido pede um controle mais fino nos volumes baixos).
// Fica depois do analisador, então a animação não muda quando o volume muda.
function aplicarVolume() {
  if (mestre) mestre.gain.setTargetAtTime(($("vol").value / 100) ** 2, ctx.currentTime, 0.02);
}
$("vol").oninput = aplicarVolume;

async function iniciar(i) {  // toca a faixa i (cria o áudio e baixa as gravações, se preciso)
  if (!LISTA.length) return;
  if (!ctx) {
    ctx = new AudioContext();
    analisador = ctx.createAnalyser(); analisador.fftSize = 2048;
    saida = ctx.createGain(); mestre = ctx.createGain();
    saida.connect(analisador); analisador.connect(mestre); mestre.connect(ctx.destination);
    mestre.gain.value = ($("vol").value / 100) ** 2;
  }
  pausado = false;
  await ctx.resume();
  $("agora").textContent = "Carregando sons...";
  try { await carregar(LISTA.flatMap(it => it.amb || [])); }
  catch (e) { $("agora").textContent = "Não foi possível carregar as gravações."; return; }
  tocar(i);
  atualizarPlay();
}

$("play").onclick = async () => {  // parado: começa; tocando: pausa; pausado: continua
  if (!atual) return iniciar(0);
  pausado = !pausado;
  await (pausado ? ctx.suspend() : ctx.resume());
  atualizarPlay();
};
$("prox").onclick = () => iniciar(atual && idx + 1 < LISTA.length ? idx + 1 : 0);
$("ant").onclick = () => {  // passou de 3 s: volta ao começo da atual; senão, vai para a anterior
  if (atual && ctx.currentTime - inicio > 3) return iniciar(idx);
  iniciar(atual && idx > 0 ? idx - 1 : LISTA.length - 1);
};
$("stop").onclick = async () => {
  if (!ctx) return;
  if (pausado) { pausado = false; await ctx.resume(); }  // relógio parado não executaria o fade
  parar();
  $("agora").textContent = ""; $("prog").style.width = 0; $("tempo").textContent = "";
  marcar(); VIS.faixa(-1, ""); atualizarPlay();
};
setInterval(() => {
  if (!atual) return;
  const dec = ctx.currentTime - inicio;
  $("prog").style.width = Math.min(100, dec / atual.it.seg * 100) + "%";
  $("tempo").textContent = `${fmt(dec)} / ${fmt(atual.it.seg)}`;
}, 500);

// ---------- Ligação com o Streamlit ----------
// A lista chega a cada execução do app. A faixa que está tocando segue de onde está: só o
// índice da próxima é reacertado (a faixa pode ter mudado de posição ou ter sido removida).
const assinatura = it => JSON.stringify([it.freqs, it.seg, it.amb, it.vol, it.pulso]);
const avisar = (tipo, extra) => window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:" + tipo, ...extra}, "*");
let primeira = true;
function receber(args) {
  if (primeira) {
    primeira = false;
    ACORDES = args.acordes; SINOS = args.sinos; GRAVACOES = args.gravacoes; registrarGravacoes();
  }
  const antigo = idx, sig = atual && assinatura(atual.it);
  LISTA = args.lista;
  if (atual) {
    let novo = -1;  // com faixas repetidas, vale a mais perto da posição antiga
    LISTA.forEach((it, i) => {
      if (assinatura(it) === sig && (novo < 0 || Math.abs(i - antigo) < Math.abs(novo - antigo))) novo = i;
    });
    if (novo >= 0) { idx = novo; $("agora").textContent = `♪ ${idx + 1}/${LISTA.length} — ${atual.it.titulo}`; }
    else {  // removida: termina de tocar e a próxima é a que ocupou o lugar dela
      idx = Math.min(antigo, LISTA.length) - 1;
      $("agora").textContent = `♪ ${atual.it.titulo} (já removida da lista)`;
    }
  }
  desenharLista();
  if (ctx) carregar(LISTA.flatMap(it => it.amb || [])).catch(() => {});
  ajustarAltura();
}
// A altura do iframe acompanha o conteúdo (a lista de faixas cresce e encolhe).
let alturaEnviada = 0;
function ajustarAltura() {
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  if (h > 0 && h !== alturaEnviada) { alturaEnviada = h; avisar("setFrameHeight", {height: h}); }
}
new ResizeObserver(ajustarAltura).observe(document.body);
window.addEventListener("message", ev => { if (ev.data && ev.data.type === "streamlit:render") receber(ev.data.args); });
avisar("componentReady", {apiVersion: 1});
ajustarAltura();

// ---------- Visualização ao vivo (estilo Windows Media Player) ----------
// Céu cósmico + geometria sagrada dourada girando devagar. Reage ao volume do som, mas com
// suavização de ~2 s: nada pisca (seguro para fotossensíveis, mesmo com batidas binaurais).
const VIS = (() => {
  const tela = $("tela"), c = tela.getContext("2d"), W = tela.width, H = tela.height;
  const ORDEM = ["flor", "metatron", "merkaba", "lotus"], S = 640, OURO = "#e8be5c";
  const estrelas = Array.from({length: 220}, () => [Math.random() * W, Math.random() * H,
                                                    0.3 + Math.random() * 0.7, Math.random() * 6.28]);
  const cache = {};

  function simbolo(nome, violeta) {  // desenhado uma vez num canvas fora da tela, com brilho
    const chave = nome + (violeta ? "-v" : "");
    if (cache[chave]) return cache[chave];
    const cv = document.createElement("canvas"); cv.width = cv.height = S;
    const d = cv.getContext("2d"), R = S * 0.40, m = S / 2;
    d.translate(m, m); d.lineWidth = 2.2; d.shadowBlur = 14;
    d.strokeStyle = violeta ? "#dcbcff" : OURO; d.shadowColor = violeta ? "#a259ff" : "#ffcf6b";
    const circ = (x, y, r) => { d.beginPath(); d.arc(x, y, r, 0, 6.2832); d.stroke(); };
    const linha = (p, q) => { d.beginPath(); d.moveTo(p[0], p[1]); d.lineTo(q[0], q[1]); d.stroke(); };
    if (nome === "flor") {
      const r = R / 3;
      for (let q = -2; q <= 2; q++) for (let s = -2; s <= 2; s++)
        if (Math.abs(q + s) <= 2) circ(r * (q + s / 2), r * s * Math.sqrt(3) / 2, r);
      circ(0, 0, R); circ(0, 0, R + 6);
    } else if (nome === "metatron") {
      const r = R / 5, cs = [[0, 0]];
      for (const k of [1, 2]) for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i + Math.PI / 6; cs.push([k * 2 * r * Math.cos(a), k * 2 * r * Math.sin(a)]);
      }
      cs.forEach((p, i) => cs.slice(i + 1).forEach(q => linha(p, q)));
      cs.forEach(([x, y]) => circ(x, y, r));
    } else if (nome === "merkaba") {
      for (const raio of [R, R / 2, R / 4]) {
        for (const desl of [0, Math.PI]) {
          const tri = [0, 1, 2].map(i => { const a = desl - Math.PI / 2 + 2 * Math.PI / 3 * i;
                                           return [raio * Math.cos(a), raio * Math.sin(a)]; });
          tri.forEach((p, i) => linha(p, tri[(i + 1) % 3]));
        }
        circ(0, 0, raio);
      }
    } else {
      for (const [n, dist, raio] of [[8, .18, .18], [16, .45, .24], [32, .75, .18]])
        for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n; circ(R * dist * Math.cos(a), R * dist * Math.sin(a), R * raio); }
      circ(0, 0, R); circ(0, 0, R * 0.08);
    }
    return cache[chave] = cv;
  }

  // Chama Violeta: partículas suaves subindo em volta do símbolo (cada uma surge e some devagar)
  function fagulha(cor) {
    const cv = document.createElement("canvas"); cv.width = cv.height = 64;
    const d = cv.getContext("2d"), g = d.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, cor); g.addColorStop(1, "rgba(0,0,0,0)");
    d.fillStyle = g; d.fillRect(0, 0, 64, 64); return cv;
  }
  const FAGULHAS = [fagulha("rgba(176,108,255,1)"), fagulha("rgba(230,190,255,1)"), fagulha("rgba(140,70,240,1)")];
  const chamas = [];
  function nova() {
    const a = Math.random() * 2 * Math.PI, r = H * (0.30 + Math.random() * 0.14);
    return {x: W / 2 + r * Math.cos(a), y: H / 2 + r * Math.sin(a) + H * 0.05, vy: 25 + Math.random() * 45,
            fase: Math.random() * 6.28, vida: 0, max: 2.5 + Math.random() * 2.5,
            tam: 45 + Math.random() * 70, img: FAGULHAS[Math.floor(Math.random() * 3)]};
  }

  let atualSim = "flor", anterior = null, troca = 0, legenda = "", nivel = 0, giro = 0, ultimo = performance.now();
  let tema = "", vio = 0;  // vio: 0 = dourado, 1 = chama violeta (transição suave)
  const dados = new Float32Array(2048);

  function escolher(i) {
    const v = $("visual").value;
    return v === "alternar" ? ORDEM[Math.max(i, 0) % ORDEM.length] : v;
  }
  $("visual").onchange = () => faixa(idx, legenda, tema);

  function faixa(i, texto, novoTema = "") {
    const novo = escolher(i);
    if (novo !== atualSim) { anterior = atualSim; atualSim = novo; troca = performance.now(); }
    legenda = texto; tema = novoTema;
  }

  function quadro(agora) {
    const dt = Math.min(0.1, (agora - ultimo) / 1000); ultimo = agora;
    // volume suavizado (constante de ~2 s): acompanha o "respirar" do mar, ignora pulsos rápidos
    if (analisador && atual) {
      analisador.getFloatTimeDomainData(dados);
      let s = 0; for (const x of dados) s += x * x;
      nivel += (Math.min(1, Math.sqrt(s / dados.length) * 4) - nivel) * Math.min(1, dt / 2);
    } else nivel += (0 - nivel) * Math.min(1, dt / 2);

    const t = agora / 1000, tocando = !!atual;
    vio += ((tema === "violeta" ? 1 : 0) - vio) * Math.min(1, dt / 1.5);
    giro += dt * (tocando ? 3 : 1.2) * Math.PI / 180;  // graus por segundo
    const fundo = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.65);
    fundo.addColorStop(0, `rgb(${58 + vio * 40 + nivel * 30},${24 + vio * 4 + nivel * 10},${104 + vio * 50 + nivel * 30})`);
    fundo.addColorStop(1, "#080418");
    c.fillStyle = fundo; c.fillRect(0, 0, W, H);
    for (const [x, y, b, f] of estrelas) {
      c.globalAlpha = b * (0.55 + 0.45 * Math.sin(t * 0.4 + f)); c.fillStyle = "#fff"; c.fillRect(x, y, 1.6, 1.6);
    }
    const respira = 0.75 + 0.25 * Math.sin(2 * Math.PI * t / 10);
    const brilho = Math.min(1, (tocando ? 0.75 : 0.45) * respira + nivel * 0.5);
    const mistura = anterior ? Math.min(1, (agora - troca) / 2000) : 1;  // troca de símbolo em 2 s
    // chamas violetas atrás do símbolo
    if (vio > 0.01 || chamas.length) {
      while (vio > 0.5 && chamas.length < 140) chamas.push(nova());
      c.save(); c.globalCompositeOperation = "lighter";
      for (let k = chamas.length - 1; k >= 0; k--) {
        const p = chamas[k]; p.vida += dt; p.y -= p.vy * dt;
        const u = p.vida / p.max;
        if (u >= 1) { if (vio > 0.5) chamas[k] = nova(); else chamas.splice(k, 1); continue; }
        const tam = p.tam * (1 - u * 0.6), x = p.x + 12 * Math.sin(p.fase + p.vida * 1.3);
        c.globalAlpha = vio * Math.sin(Math.PI * u) * (0.7 + nivel * 0.3);  // surge e some devagar
        c.drawImage(p.img, x - tam / 2, p.y - tam, tam, tam * 2);  // alongada: labareda
      }
      c.restore();
    }
    const desenhar = (nome, alfa) => {
      const lado = H * 0.95 * (1 + 0.03 * respira);
      c.save(); c.translate(W / 2, H / 2); c.rotate(giro); c.globalCompositeOperation = "lighter";
      for (const [img, peso] of [[simbolo(nome, false), 1 - vio], [simbolo(nome, true), vio]]) {
        if (peso < 0.01) continue;
        c.filter = "none"; c.globalAlpha = alfa * brilho * peso;
        c.drawImage(img, -lado / 2, -lado / 2, lado, lado);
        c.globalAlpha = alfa * brilho * peso * 0.6; c.filter = "blur(10px)";  // halo
        c.drawImage(img, -lado / 2, -lado / 2, lado, lado);
      }
      c.restore();
    };
    if (anterior && mistura < 1) desenhar(anterior, 1 - mistura); else anterior = null;
    desenhar(atualSim, mistura);
    c.globalAlpha = 1; c.fillStyle = vio > 0.5 ? "#dcbcff" : OURO; c.textAlign = "center";
    c.font = "34px 'Source Sans Pro', sans-serif";
    c.fillText(legenda, W / 2, H - 30);
    c.textAlign = "right"; c.font = "18px 'Source Sans Pro', sans-serif"; c.fillStyle = "#a07a1f";
    c.fillText("feito por Elrofs", W - 20, H - 16);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);

  $("cheia").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : tela.requestFullscreen())
    .catch(() => { $("agora").textContent = "Tela cheia não permitida aqui: use F11 no navegador."; });
  return {faixa};
})();
</script>
